name: telemetry

on:
  schedule:
    - cron: "17 3 * * *"        # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/telemetry.py data/telemetry.json

      - name: Rebuild the canvas
        run: python3 scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets README.md
          git diff --cached --quiet || git commit -m "Update telemetry"
          git push
