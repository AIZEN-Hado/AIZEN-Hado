# Rebuilds the profile once a day. Two images are driven by live data: the accretion disk in the hero (your
# last 365 days of activity) and the night-sky panel (public commits per repository, plus the moon). Why an
# Action at all: GitHub caches README images through its camo proxy, and third-party stat services go down or
# get rate-limited. Rendering our own SVGs into the repo keeps them fast, on-brand and always available.
name: telemetry

on:
  schedule:
    - cron: "17 3 * * *"          # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only. If an API call fails the step fails and the last good images stay up.
      - name: Fetch activity and rebuild the profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/build.py --fetch

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets scripts/telemetry.json scripts/canvas.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Update telemetry"
          git push
