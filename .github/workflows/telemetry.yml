# Refreshes the only data-driven image in the profile (assets/telemetry.svg) from GitHub's GraphQL API.
# Why an Action at all: GitHub caches README images through its camo proxy, and third-party stat
# services go down or get rate-limited. Rendering our own SVG into the repo keeps the panel fast,
# on-brand and always available. Everything else in the README is static and needs no automation.
name: telemetry

on:
  schedule:
    - cron: "17 3 * * *"          # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/telemetry.py"
      - "scripts/kit.py"
      - "scripts/glyphs.json"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only. If the API call fails the step fails and the last good panel stays up.
      - name: Fetch activity and render panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/telemetry.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg assets/static/telemetry.svg scripts/telemetry.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Update telemetry"
          git push
